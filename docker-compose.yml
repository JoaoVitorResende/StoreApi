# docker-compose.yml
services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-store}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?defina RABBIT_PASSWORD no .env}
    ports:
      - "5672:5672"
      - "15672:15672"   # painel: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db

  storeapi:
    build:
      context: ./StoreApi/src
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Postgres: "Host=host.docker.internal;Port=5432;Database=storeapi;Username=postgres;Password=${PG_PASSWORD}"
      ConnectionStrings__Mongo: "mongodb://mongo:27017"
      Mongo__DatabaseName: storeapi
      RabbitMq__Host: rabbitmq          # usado quando o publicador existir
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  purchases-api:
    build:
      context: ./purchases-api
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://postgres:${PG_PASSWORD}@host.docker.internal:5432/purchases"
      RABBITMQ_URL: "amqp://${RABBIT_USER:-store}:${RABBIT_PASSWORD}@rabbitmq:5672/"   # usado pelo consumidor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mongodata: